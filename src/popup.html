<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salasel</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup" role="main">

    <header class="header">
      <div class="brand">
        <img class="logo" src="../icons/icon-48.png" alt="Salasel" width="32" height="32" />
        <div class="brand-text">
          <h1 class="brand-name" data-i18n="appName">سلاسل</h1>
          <p class="brand-tag" data-i18n="brandTag">مرافق التركيز</p>
        </div>
      </div>
      <span class="status-badge" id="status-badge" aria-live="polite"></span>
    </header>

    <section class="translate" aria-label="Language">
      <label for="lang-select" class="translate-label">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15 15 0 0 1 0 20"/>
          <path d="M12 2a15 15 0 0 0 0 20"/>
        </svg>
        <span data-i18n="langLabel">اللغة</span>
      </label>
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>
    </section>

    <ul class="toggle-list" id="toggle-list">

      <li class="row">
        <div class="row-text">
          <label for="toggle-sidebar" class="row-title" data-i18n="sidebarTitle"></label>
          <p class="row-desc" data-i18n="sidebarDesc"></p>
        </div>
        <label class="switch" for="toggle-sidebar">
          <input type="checkbox" id="toggle-sidebar" data-key="hideRecommendationSidebar" />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </li>

      <li class="row">
        <div class="row-text">
          <label for="toggle-upnext" class="row-title" data-i18n="upnextTitle"></label>
          <p class="row-desc" data-i18n="upnextDesc"></p>
        </div>
        <label class="switch" for="toggle-upnext">
          <input type="checkbox" id="toggle-upnext" data-key="hideUpNextAutoplay" />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </li>

      <li class="row">
        <div class="row-text">
          <label for="toggle-endscreen" class="row-title" data-i18n="endscreenTitle"></label>
          <p class="row-desc" data-i18n="endscreenDesc"></p>
        </div>
        <label class="switch" for="toggle-endscreen">
          <input type="checkbox" id="toggle-endscreen" data-key="hideEndScreenCards" />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </li>

      <li class="row">
        <div class="row-text">
          <label for="toggle-shorts" class="row-title" data-i18n="shortsTitle"></label>
          <p class="row-desc" data-i18n="shortsDesc"></p>
        </div>
        <label class="switch" for="toggle-shorts">
          <input type="checkbox" id="toggle-shorts" data-key="hideShortsShelf" />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </li>

      <li class="row">
        <div class="row-text">
          <label for="toggle-comments" class="row-title" data-i18n="commentsTitle"></label>
          <p class="row-desc" data-i18n="commentsDesc"></p>
        </div>
        <label class="switch" for="toggle-comments">
          <input type="checkbox" id="toggle-comments" data-key="hideComments" />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </li>

      <li class="row">
        <div class="row-text">
          <label for="toggle-home" class="row-title" data-i18n="homeTitle"></label>
          <p class="row-desc" data-i18n="homeDesc"></p>
        </div>
        <label class="switch" for="toggle-home">
          <input type="checkbox" id="toggle-home" data-key="hideHomepageFeed" />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </li>

    </ul>

    <footer class="footer">
      <a href="https://salasel.app" target="_blank" rel="noopener noreferrer" class="footer-link">
        <span data-i18n="footer">جزء من سلاسل</span>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17L17 7"/>
          <path d="M8 7h9v9"/>
        </svg>
      </a>
    </footer>

  </main>

  <script src="storage.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
